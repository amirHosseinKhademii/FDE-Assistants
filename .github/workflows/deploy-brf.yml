# Manual trigger only, and it refuses to run without a typed confirmation.
#
# Builds the Brf Exempelgården demo image (infra/brf/Dockerfile) and deploys it as the
# Container App brf-app in the existing environment cae-pharma. Modelled on the pharma
# jobs in deploy.yml, and not wired into the site pipeline: brf is not linked from
# veresk.se, so there is no reason to rebuild the host when it changes.
#
# Running it UPDATES the container app's image. The app itself is created once, by hand,
# with its secrets (see the create branch below), because the secrets are not GitHub
# secrets and this workflow does not hold them.
#
# The app's secrets, set on the container app and never in this file:
#   api-key      the visitor-facing key (x-api-key), used by the owner and by the guard
#   hosted-key   the hosted model key, HOSTED_API_KEY
#   brf-db-url   BRF_DATABASE_URL, the Neon database pharma uses, own tables only
# The workflow sets the image, the non-secret settings, and the scale.

name: deploy-brf

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type yes-deploy-brf to run. Anything else stops before Azure is touched.'
        required: true
        type: string

concurrency:
  group: deploy-brf
  cancel-in-progress: false

env:
  RG: rg-claims-fde
  ENVIRONMENT: cae-pharma
  BRF_APP: brf-app
  BRF_REPO: docker.io/amir2575/brf-demo

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: 0 · confirm
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ inputs.confirm }}" != "yes-deploy-brf" ]; then
            echo "::error::not confirmed. Re-run with yes-deploy-brf in the confirm box."
            exit 1
          fi

  brf-build:
    name: 1 · build brf image
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/brf/Dockerfile
          push: true
          tags: ${{ env.BRF_REPO }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,scope=brf
      - run: echo "✅ **1 · brf image built**, \`${BRF_REPO}:sha-${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  brf-deploy:
    name: 2 · deploy brf
    needs: brf-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # UPDATE ONLY, and no create branch that stands the app up on its own. The app
      # carries three secrets that this workflow does not hold, so a create here would
      # answer 503 on every question while the page in front of it answers 200. The app
      # was created by hand with its secrets. If it is ever gone, recreate it the same way
      # (see docs/brf for the runbook), rather than letting this job do it half-configured.
      - name: Point the app at the new image
        run: |
          image="${BRF_REPO}:sha-${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          if ! names=$(az containerapp list -g "$RG" --query "[].name" -o tsv 2>/tmp/az-err); then
            echo "::error::cannot list container apps in $RG. Azure said: $(cat /tmp/az-err)"
            exit 1
          fi
          if ! printf '%s\n' "$names" | grep -qx "$BRF_APP"; then
            echo "::error::$BRF_APP does not exist in $RG. Create it by hand with its secrets first."
            exit 1
          fi
          az containerapp update -n "$BRF_APP" -g "$RG" --image "$image" \
            --set-env-vars PUBLIC_DEMO=true LLM_PROVIDER=hosted HOSTED_MODEL=gemini-3.5-flash-lite \
              LOOP=mastra EMBEDDINGS=local \
            --output none

      - name: Wait for the revision
        run: |
          for i in $(seq 1 40); do
            state=$(az containerapp revision list -n "$BRF_APP" -g "$RG" \
              --query "[?properties.active] | [0].properties.provisioningState" -o tsv)
            image=$(az containerapp show -n "$BRF_APP" -g "$RG" \
              --query "properties.template.containers[0].image" -o tsv)
            echo "attempt $i, provisioning=$state image=$image"
            if [ "$state" = "Provisioned" ] && [ "$image" = "$IMAGE" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::no active revision reached Provisioned with $IMAGE"
          exit 1

      - name: Smoke test
        id: smoke
        run: |
          fqdn=$(az containerapp show -n "$BRF_APP" -g "$RG" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          url="https://$fqdn"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          ok=
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 "$url/")
            echo "attempt $i, GET / -> $code"
            [ "$code" = "200" ] && { ok=yes; break; }
            sleep 10
          done
          [ "$ok" = "yes" ] || { echo "::error::brf never returned 200 on /"; exit 1; }
          # With PUBLIC_DEMO=true a request with NO key is allowed, metered. The probe sends a
          # WRONG key instead, which must still be refused before any model call is made.
          guard=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            -X POST "$url/api/ask" \
            -H 'content-type: application/json' -H 'x-api-key: wrong-key-smoke-probe' \
            -d '{"question":"ping"}')
          echo "POST /api/ask with a wrong key -> $guard"
          [ "$guard" = "401" ] || { echo "::error::the guard did not refuse a wrong key (got $guard)"; exit 1; }
          echo "✅ **2 · brf deployed**, <$url>" >> "$GITHUB_STEP_SUMMARY"
