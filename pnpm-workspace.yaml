# Eight packages: seven domain-neutral, one that is the actual job.
#
#   packages/grounding   @fde/grounding   documents → chunks → vectors →
#                        hybrid search. Hand it a source and a domain
#                        descriptor; it never learns what your documents mean.
#   packages/agent       @fde/agent       the tool-calling loop behind one
#                        contract, with two interchangeable engines, plus the
#                        compliance checks that assert what goes on the wire.
#   packages/evals       @fde/evals       repeat runs, severity buckets,
#                        baselines, diffs. You supply the cases, the checks,
#                        and what counts as dangerous.
#   packages/schema      @fde/schema      parse → shape → coherence rules the
#                        type system cannot express.
#   packages/telemetry   @fde/telemetry   one durable line per request.
#   packages/foundry     @fde/foundry     Azure credentials, no stored key.
#   packages/guard       @fde/guard       fail-closed API auth.
#   packages/bedrock     @fde/bedrock     AWS credentials for Amazon
#                        Bedrock — the sibling @fde/foundry's docstring
#                        promised, written to find out if the claim held.
#
#   packages/insurance   @claims/insurance THE JUDGMENT. The corpus and its
#                        generator, the three tools, the prompt, the answer
#                        fields and their coherence rules, the severity
#                        classifier, the cases, the prices. None of it
#                        transfers, and that is the point — it is what a
#                        customer is paying for.
#   apps/insurance-app   @claims/insurance-app
#                        pages and server routes. ESM, Vite, React.
#
# SINCE THEN: three more packages and two more apps. `@fde/uikit` joined the
# reusable set; `@meridian/pharma` and `@vantis/steering` are second and third
# siblings of `packages/insurance`, which is the claim above being tested rather
# than asserted. `@veresk/surface` is the one that does not fit either half —
# it is this SITE's shared parts, and it knows there is a firm with several
# engagements, so it is neither liftable nor one customer's judgement. It is
# named `@veresk/` and not `@fde/` so that `pnpm leak:check`, which keys on the
# `@fde/` prefix, correctly leaves it alone.
#
#   apps/veresk-app      @veresk/app           the firm's door and Meridian
#                        Pharma's pages.       Port 3300.
#   apps/steering-app    @vantis/steering-app  Vantis Steering's page.
#                        Port 3400.
#
# EACH ENGAGEMENT IS ITS OWN DEPLOYMENT, which is why they are separate apps
# rather than separate routes: the firm's page links across by URL, and a link
# that crosses an origin should not be able to pretend it does not.
#
# THE RULE THE SPLIT FOLLOWS: buy the transport, write the judgment. Roughly
# 5,900 lines are domain-neutral and 3,200 are not. A second customer writes a
# sibling of packages/insurance and changes nothing above it.
#
# The root is a workspace root and nothing else: no src, no dependencies of its
# own, scripts that delegate.
packages:
  # FOUR GLOBS, AND THE SPLIT IS THE POINT.
  #
  #   apps/web/*        a deployable surface: TanStack Start, a vite.config.ts,
  #                     a port, an entry in .github/workflows/deploy.yml
  #   apps/ai/*         an engagement's own judgement and its CLIs — the agent
  #                     loops, the tools, the prompts, the schemas, the evals.
  #                     No port. Imported BY the surface next door.
  #   apps/api/*        THE CUSTOMER'S OWN BACKEND, and the newest kind. A port,
  #                     a database credential, and NO AI IN IT ANYWHERE — no
  #                     model call, no embedding, no prompt, no @fde/agent. That
  #                     is not an omission, it is the point: the fifth engagement
  #                     puts an agent in front of an API a retailer would already
  #                     have, so the API has to be written as one that predates
  #                     us. If something AI-shaped is imported here, it is in the
  #                     wrong package. The glob reads `apps/api/*` and not
  #                     `apps/backend` so the convention holds at
  #                     apps/<kind>/<engagement> and a sixth engagement has
  #                     somewhere to go.
  #   apps/mcp/*        THE PROTOCOL LAYER, and the reason the fifth engagement
  #                     exists at all. An MCP server per engagement: it owns the
  #                     tool definitions and the retrieval index, and it holds NO
  #                     business-database credential — it reaches the estate only
  #                     through apps/api/* with a service token. That emptiness
  #                     is the deliverable. Inside the API it would be one more
  #                     module in a process already holding five database pools,
  #                     and "the MCP server has no credential" would be a
  #                     sentence nobody could check. Separate, it is structural.
  #                     See docs/commerce/PLAN.md §4.1 for the argument, and
  #                     §10 for the measurement that decides whether it paid.
  #   packages/*        what is left is what transfers: every @fde/*, plus
  #                     @veresk/surface, which is this site's own shared parts.
  #   packages/providers/*
  #                     the two DEPLOYMENT adapters — how a model is reached,
  #                     not what is asked of it. Two packages and not one on
  #                     purpose: @fde/bedrock brings the AWS and Anthropic SDKs
  #                     and exactly ONE package depends on it, while four depend
  #                     on @fde/foundry. Merging them would hand the AWS SDK to
  #                     @fde/agent, insurance and pharma for code none of them
  #                     calls — and `openai@7` declares an OPTIONAL PEER on
  #                     @aws-sdk/credential-provider-node, which is the whole
  #                     reason .npmrc exists. The 92-vs-567 line difference
  #                     between them is also a measurement worth keeping visible:
  #                     Azure serves the OpenAI protocol natively and needs no
  #                     translation; Anthropic does not, and 167 of those lines
  #                     are the translator.
  #
  # `leak:check` keys on the `@fde/` PREFIX, not on this directory, so moving
  # the engagements out of packages/ did not change what it guards. It scans
  # packages/ and every name there that starts with @fde/ must stay free of one
  # customer's vocabulary.
  - 'apps/web/*'
  - 'apps/ai/*'
  - 'apps/api/*'
  - 'apps/mcp/*'
  - 'packages/*'
  - 'packages/providers/*'
